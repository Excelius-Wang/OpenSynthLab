[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opensynthlab"
version = "0.1.0a1"
description = "Configurable synthetic data workflows for LLMs: template-based generation, validation, and JSONL export."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OpenSynthLab contributors" }]
keywords = ["synthetic-data", "data-generation", "llm", "datasets"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Excelius-Wang/OpenSynthLab"
Repository = "https://github.com/Excelius-Wang/OpenSynthLab"
Issues = "https://github.com/Excelius-Wang/OpenSynthLab/issues"
Changelog = "https://github.com/Excelius-Wang/OpenSynthLab/blob/main/CHANGELOG.md"

[project.scripts]
opensynthlab = "opensynthlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opensynthlab"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/README.md", "/README.zh-CN.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]
